name: shim

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLite store path on the shimdata volume below; .env must NOT set
      # SQLITE_PATH (compose wins, but keep the two from drifting)
      SQLITE_PATH: /app/data/shim.sqlite
    # LOAD-BEARING binding: the host's existing cloudflared (remotely-managed
    # systemd service) ingress targets http://localhost:7300. Do not remove.
    ports:
      - "127.0.0.1:7300:3000"
    depends_on:
      lmdis:
        condition: service_healthy
    volumes:
      # SQLite store (casts/follows) — survives container rebuilds and reboots
      - shimdata:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  lmdis:
    # requires a sibling checkout: git clone https://github.com/artlu99/lmdis ../lmdis
    build:
      context: ../lmdis
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      LMDIS_REST_TOKEN: ${LMDIS_REST_TOKEN:?set LMDIS_REST_TOKEN in .env}
      LMDB_PATH: /app/data/lmdb
      # TTL-heavy cache workload: proactive sweep caps disk at a high-water mark
      LMDIS_SWEEP_INTERVAL_MS: "60000"
    volumes:
      - lmdisdata:/app/data
    mem_limit: 512m
    healthcheck:
      # /ready (not /health): verifies LMDB is reachable, 503 until it is
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    # no ports: reachable only on the compose network

volumes:
  shimdata:
  lmdisdata:
