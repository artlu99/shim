# Default keeps an existing single-user volume named shim. A second account
# sets COMPOSE_PROJECT_NAME in its own .env (install.sh writes shim-<user>).
name: ${COMPOSE_PROJECT_NAME:-shim}

services:
  app:
    build:
      context: .
      args:
        SHIM_GIT_SHA: ${SHIM_GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLite store path on the shimdata volume below; .env must NOT set
      # SQLITE_PATH (compose wins, but keep the two from drifting)
      SQLITE_PATH: /app/data/shim.sqlite
      # Compose-network Redis. .env may set REDIS_URL for bare-metal
      # `bun dev`; inside the stack this wins so the app always hits the
      # sibling service.
      REDIS_URL: redis://redis:6379
    # Loopback only. The container listens on 3000. SHIM_PORT in .env
    # changes the host port when 7300 is already taken. Cloudflared must
    # target whichever host port this publishes.
    ports:
      - "127.0.0.1:${SHIM_PORT:-7300}:3000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # SQLite store (casts/follows) — survives container rebuilds and reboots
      - shimdata:/app/data
    healthcheck:
      # single-shot curl: the interval/retries knobs below own the retry
      # semantics, and curl's exit code + stderr (connection refused vs
      # HTTP error) show up in `docker inspect`'s health log.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    # maxmemory is the real bound; mem_limit is cgroup headroom above it
    # (RSS + fragmentation). allkeys-lru drops cold keys under pressure
    # instead of thrashing — the failure mode lmdis/LMDB hit at 512m–1g.
    # No RDB/AOF: this is a TTL cache, not durable state.
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    # no ports: reachable only on the compose network

volumes:
  shimdata:
